<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b2b3b">
<title>MyBook - Read Learn Grow</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f4ef;color:#263342;font-family:Arial,sans-serif}
header{background:#1b2b3b;color:white;padding:28px 20px 30px;border-radius:0 0 28px 28px}
.logo{font-size:25px;font-weight:bold}
.sub{color:#dfc58d;margin-top:10px}
h1{font-size:34px;margin:35px 0 8px}
header p{color:#dce2e8}
.search{width:100%;padding:16px;border:0;border-radius:14px;font-size:17px;margin-top:20px}
main{max-width:700px;margin:auto;padding:20px}
h2{font-size:23px;margin-top:28px}
.languages,.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang,.mode{padding:17px 10px;border:2px solid #e3dfd6;background:white;border-radius:15px;font-size:17px;color:#263342}
.active{border:2px solid #c5a15d;background:#fffaf0}
.mode.active{background:#1b2b3b;color:white}
.book{background:white;padding:17px;border-radius:20px;margin:15px 0;box-shadow:0 5px 18px #00000009}
.cover{height:105px;background:#e9e0ce;border-radius:14px;display:grid;place-items:center;font-size:38px}
.book h3{font-size:22px;margin:15px 0 5px}
.small{color:#777;font-size:14px}
.read{background:#1b2b3b;color:white;border:0;padding:14px 20px;border-radius:12px;font-size:16px;margin-top:12px}
.reader{display:none;background:white;padding:20px;border-radius:20px;margin-top:20px}
.reader p{white-space:pre-line;line-height:1.9;font-size:17px}
select{padding:12px;border:1px solid #ddd;border-radius:10px;background:white;font-size:16px;margin:12px 0}
footer{text-align:center;padding:25px;color:#888}
</style>
</head>
<body>
<header>
<div class="logo">📚 MYBOOK</div>
<div class="sub">ENGLISH · မြန်မာ · 한국어 · 中文</div>
<h1>Read. Learn. Grow.</h1>
<p>စာဖတ်ပါ။ လေ့လာပါ။ တိုးတက်ပါ။</p>
<input class="search" id="search" placeholder="Search books..." oninput="renderBooks()">
</header>
<main>
<h2>🌍 Choose your language</h2>
<div class="languages">
<button class="lang active" onclick="chooseLang('en',this)">🇬🇧 English</button>
<button class="lang" onclick="chooseLang('my',this)">🇲🇲 မြန်မာ</button>
<button class="lang" onclick="chooseLang('ko',this)">🇰🇷 한국어</button>
<button class="lang" onclick="chooseLang('zh',this)">🇨🇳 中文</button>
</div>
<h2>📖 Reading mode</h2>
<div class="modes">
<button class="mode active" onclick="setMode('single',this)">Single language</button>
<button class="mode" onclick="setMode('dual',this)">Dual: selected + Myanmar</button>
</div>
<h2>✨ My Library</h2>
<div id="books"></div>
<div class="reader" id="reader">
<button class="read" onclick="closeBook()">← Back</button>
<h2 id="bookTitle"></h2>
<select id="language" onchange="updateReader()">
<option value="en">🇬🇧 English</option>
<option value="my">🇲🇲 မြန်မာ</option>
<option value="ko">🇰🇷 Korean</option>
<option value="zh">🇨🇳 Chinese</option>
</select>
<div id="content"></div>
<button class="read" onclick="bookmark()">🔖 Save bookmark</button>
<p class="small" id="saved"></p>
</div>
</main>
<footer>MYBOOK © 2026 · Read. Learn. Grow.</footer>
<script>
let selected='en',mode='single',current=0;
const books=[
{title:'Know Yourself',icon:'🌱',category:'Self Development',text:{
en:'Knowing yourself is the beginning of wisdom.\n\nTake time to understand your strengths, weaknesses and dreams.\n\nAsk yourself: What makes me happy? What do I want to improve? What kind of person do I want to become?\n\nWrite down your thoughts every day. Be honest with yourself. Small steps help you discover who you really are.',
my:'ကိုယ့်ကိုယ်ကို သိခြင်းသည် ဉာဏ်ပညာ၏ အစဖြစ်သည်။\n\nကိုယ့်ရဲ့ အားသာချက်၊ အားနည်းချက်နဲ့ အိပ်မက်တွေကို နားလည်ဖို့ အချိန်ပေးပါ။\n\nကိုယ့်ကိုယ်ကို မေးပါ။ ဘာတွေက ပျော်ရွှင်စေသလဲ။ ဘာတွေကို တိုးတက်အောင် လုပ်ချင်သလဲ။ ဘယ်လိုလူတစ်ယောက် ဖြစ်ချင်သလဲ။\n\nနေ့တိုင်း ကိုယ့်အတွေးတွေကို ရေးမှတ်ပါ။ ကိုယ့်ကိုယ်ကို ရိုးသားပါ။',
ko:'자신을 아는 것이 지혜의 시작입니다.\n\n자신의 장점과 단점, 꿈을 이해하는 시간을 가지세요.\n\n무엇이 나를 행복하게 할까요? 무엇을 개선하고 싶나요? 어떤 사람이 되고 싶나요?\n\n매일 자신의 생각을 기록하세요.',
zh:'认识自己是智慧的开始。\n\n花时间了解自己的优点、缺点和梦想。\n\n问问自己：什么让我快乐？我想改善什么？我想成为什么样的人？\n\n每天记录自己的想法。'
}},
{title:'Build Good Habits',icon:'⭐',category:'Personal Growth',text:{
en:'Small actions create big changes.\n\nStart your day with a simple plan. Read a few pages, exercise for ten minutes and learn something new.\n\nGood habits take time. Do not give up when progress feels slow. Be consistent and celebrate every small achievement.',
my:'သေးငယ်တဲ့ လုပ်ဆောင်ချက်တွေက ကြီးမားတဲ့ ပြောင်းလဲမှုတွေကို ဖြစ်စေပါတယ်။\n\nတစ်နေ့တာကို ရိုးရှင်းတဲ့ အစီအစဉ်နဲ့ စတင်ပါ။ စာမျက်နှာအနည်းငယ်ဖတ်ပါ။ ဆယ်မိနစ်လောက် လေ့ကျင့်ခန်းလုပ်ပါ။ အသစ်တစ်ခု သင်ယူပါ။\n\nအလေ့အကျင့်ကောင်းတွေ ရဖို့ အချိန်ယူရပါတယ်။ တိုးတက်မှုနှေးနေလို့ လက်မလျှော့ပါနဲ့။',
ko:'작은 행동이 큰 변화를 만듭니다.\n\n간단한 계획으로 하루를 시작하세요. 몇 페이지를 읽고, 10분 동안 운동하고, 새로운 것을 배우세요.\n\n좋은 습관에는 시간이 필요합니다. 포기하지 마세요.',
zh:'小小的行动会带来巨大的改变。\n\n用一个简单的计划开始新的一天。读几页书，运动十分钟，学习新知识。\n\n养成好习惯需要时间。不要轻易放弃。'
}},
{title:'A Better Life',icon:'🌸',category:'Life & Happiness',text:{
en:'A happy life begins with gratitude.\n\nAppreciate what you have and be kind to the people around you. Spend time in nature, take care of your body and make time for the things you love.\n\nYou do not need a perfect life to be happy. Start with one good thing today.',
my:'ပျော်ရွှင်တဲ့ ဘဝတစ်ခုဟာ ကျေးဇူးတင်တတ်ခြင်းကနေ စတင်ပါတယ်။\n\nကိုယ်ပိုင်ဆိုင်ထားတာတွေကို တန်ဖိုးထားပါ။ ပတ်ဝန်းကျင်က လူတွေကို ကြင်နာပါ။ သဘာဝနဲ့ အချိန်ကုန်ဆုံးပါ။ ကိုယ့်ခန္ဓာကိုယ်ကို ဂရုစိုက်ပါ။\n\nပျော်ရွှင်ဖို့ ပြည့်စုံတဲ့ဘဝ မလိုအပ်ပါဘူး။ ဒီနေ့ ကောင်းတဲ့အရာလေးတစ်ခုနဲ့ စတင်ပါ။',
ko:'행복한 삶은 감사하는 마음에서 시작됩니다.\n\n가진 것에 감사하고 주변 사람들에게 친절하세요. 자연 속에서 시간을 보내고 몸을 돌보세요.\n\n행복하기 위해 완벽한 삶이 필요하지 않습니다.',
zh:'幸福的生活始于感恩。\n\n珍惜你所拥有的，对身边的人友善。花时间亲近大自然，照顾好自己的身体。\n\n幸福不需要完美的人生。从今天的一件好事开始。'
}}
];
function chooseLang(lang,btn){
selected=lang;
document.querySelectorAll('.lang').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
if(document.getElementById('reader').style.display==='block'){
document.getElementById('language').value=lang;updateReader();
}
}
function setMode(value,btn){
mode=value;
document.querySelectorAll('.mode').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
if(document.getElementById('reader').style.display==='block')updateReader();
}
function renderBooks(){
let q=document.getElementById('search').value.toLowerCase();
document.getElementById('books').innerHTML=books.map((b,i)=>b.title.toLowerCase().includes(q)||b.category.toLowerCase().includes(q)?'<div class="book"><div class="cover">'+b.icon+'</div><h3>'+b.title+'</h3><div class="small">'+b.category+' · MyBook Original</div><button class="read" onclick="openBook('+i+')">Read Book →</button></div>':'').join('');
}
function openBook(i){
current=i;
document.getElementById('reader').style.display='block';
document.getElementById('bookTitle').textContent=books[i].title;
document.getElementById('language').value=selected;
updateReader();
document.getElementById('reader').scrollIntoView({behavior:'smooth'});
}
function updateReader(){
let lang=document.getElementById('language').value;
let b=books[current].text;
let html='<p>'+b[lang]+'</p>';
if(mode==='dual'&&lang!=='my')html+='<hr><h3>🇲🇲 မြန်မာဘာသာ</h3><p>'+b.my+'</p>';
document.getElementById('content').innerHTML=html;
}
function closeBook(){document.getElementById('reader').style.display='none';}
function bookmark(){
localStorage.setItem('mybook-bookmark',current);
document.getElementById('saved').textContent='🔖 Bookmark saved!';
}
renderBooks();
</script>
</body>
</html>
