<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1b2b3b"><title>MyBook — Read, Learn, Grow</title>
<style>
:root{--navy:#1b2b3b;--gold:#c5a15d;--paper:#f6f4ef;--ink:#263342}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:28px 20px 30px;border-radius:0 0 28px 28px}
.logo{font-size:25px;font-weight:800;letter-spacing:2px}.sub{color:#e1c78f;margin-top:9px;font-size:14px}
h1{font-size:34px;margin:34px 0 8px}.hero-line{color:#e1e6eb;margin:0 0 18px}
.search{width:100%;padding:16px;border:0;border-radius:14px;font-size:17px}
main{max-width:760px;margin:auto;padding:20px}h2{font-size:23px;margin:28px 0 15px}
.languages,.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang,.mode{padding:16px 10px;border:2px solid #e2ded6;background:#fff;border-radius:15px;font-size:16px;color:var(--ink);font-weight:600}
.lang.active{border:2px solid var(--gold);background:#fffaf0}.mode.active{background:var(--navy);color:white;border-color:var(--navy)}
.book{background:#fff;padding:16px;border-radius:20px;margin:15px 0;box-shadow:0 5px 18px #00000009}
.cover{height:112px;background:#e9e0ce;border-radius:14px;display:grid;place-items:center;font-size:42px}
.book h3{font-size:22px;margin:14px 0 5px}.small{color:#777;font-size:14px}
.read,.action{background:var(--navy);color:white;border:0;padding:13px 18px;border-radius:12px;font-size:16px;font-weight:650;margin-top:12px}
.reader{display:none;background:#fff;padding:20px;border-radius:20px;margin-top:20px;box-shadow:0 5px 18px #00000008}
.reader h2{font-size:27px;margin:24px 0 12px}.reader select{padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:16px;margin:8px 0 16px;max-width:100%}
.chapter-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.chapter-btn{border:1px solid #e4e0d8;background:#faf9f6;padding:11px;border-radius:10px;text-align:left;color:var(--ink);font-size:14px}
.chapter-btn.current{border:2px solid var(--gold);background:#fffaf0}
.chapter-body{font-size:18px;line-height:1.95;white-space:pre-line;margin:18px 0 24px}
.chapter-body h3{font-size:16px;color:#98743a;margin-bottom:6px}
.navrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.navrow button{flex:1;min-width:115px}
.progress-wrap{height:8px;background:#eee;border-radius:20px;overflow:hidden;margin:12px 0 5px}
.progress{height:100%;width:0;background:var(--gold);transition:width .2s}
footer{text-align:center;padding:28px;color:#888}
@media(max-width:420px){h1{font-size:30px}.chapter-list{grid-template-columns:1fr}.chapter-body{font-size:17px}}
</style></head><body>
<header><div class="logo">📚 MYBOOK</div><div class="sub">ENGLISH · မြန်မာ · 한국어 · 中文</div>
<h1>Read. Learn. Grow.</h1><p class="hero-line">စာဖတ်ပါ။ လေ့လာပါ။ တိုးတက်ပါ။</p>
<input class="search" id="search" placeholder="Search books..." oninput="renderBooks()"></header>
<main><section id="home">
<h2>🌍 Choose your language</h2><div class="languages">
<button class="lang active" data-lang="en" onclick="chooseLang('en',this)">🇬🇧 English</button>
<button class="lang" data-lang="my" onclick="chooseLang('my',this)">🇲🇲 မြန်မာ</button>
<button class="lang" data-lang="ko" onclick="chooseLang('ko',this)">🇰🇷 한국어</button>
<button class="lang" data-lang="zh" onclick="chooseLang('zh',this)">🇨🇳 中文</button></div>
<h2>📖 Reading mode</h2><div class="modes">
<button class="mode active" onclick="setMode('single',this)">Single language</button>
<button class="mode" onclick="setMode('dual',this)">Dual: selected + Myanmar</button></div>
<h2>✨ My Library <span class="small" id="count"></span></h2><div id="books"></div></section>
<section class="reader" id="reader"><button class="action" onclick="closeBook()">← Back to library</button>
<h2 id="bookTitle"></h2><div class="small" id="chapterMeta"></div>
<div class="progress-wrap"><div class="progress" id="progress"></div></div><div class="small" id="progressText"></div>
<div class="chapter-list" id="chapterList"></div>
<label for="language" class="small">Reading language / ဘာသာစကား</label><br>
<select id="language" onchange="updateReader()"><option value="en">🇬🇧 English</option><option value="my">🇲🇲 မြန်မာ</option><option value="ko">🇰🇷 Korean</option><option value="zh">🇨🇳 Chinese</option></select>
<div id="content" class="chapter-body"></div><div class="navrow">
<button class="action" id="prevBtn" onclick="moveChapter(-1)">← Previous</button>
<button class="action" id="nextBtn" onclick="moveChapter(1)">Next chapter →</button></div>
<div class="navrow"><button class="action" onclick="bookmark()">🔖 Save bookmark</button>
<button class="action" onclick="markRead()">✓ Mark as read</button></div><p class="small" id="saved"></p></section></main>
<footer>MYBOOK © 2026 · Read. Learn. Grow.</footer>
<script>
const books=[{"title":"Know Yourself","icon":"🌱","category":"Self Development","chapters":[{"title":"Start With Self-Awareness","texts":{"en":"Knowing yourself begins with noticing your thoughts, feelings, and choices. Take a quiet moment each day and ask what gave you energy and what made you uncomfortable. You do not need to change everything at once; honest attention is the first step.","my":"ကိုယ့်ကိုယ်ကို သိရှိဖို့ ကိုယ့်အတွေး၊ ခံစားချက်နဲ့ ရွေးချယ်မှုတွေကို သတိထားကြည့်ပါ။ နေ့တိုင်း တိတ်ဆိတ်တဲ့အချိန်ယူပြီး ဘယ်အရာက အားအင်ပေးသလဲ၊ ဘယ်အရာက စိတ်မသက်မသာဖြစ်စေသလဲ မေးပါ။ အရာအားလုံးကို တစ်ခါတည်း ပြောင်းလဲဖို့ မလိုပါဘူး။ ရိုးသားစွာ အာရုံစိုက်ခြင်းက ပထမခြေလှမ်းပါ။","ko":"자신을 알아가는 일은 생각과 감정, 선택을 살펴보는 데서 시작됩니다. 매일 조용한 시간을 내어 무엇이 힘을 주고 무엇이 불편했는지 물어보세요. 모든 것을 한 번에 바꿀 필요는 없습니다. 자신에게 솔직하게 관심을 기울이는 것이 첫걸음입니다.","zh":"认识自己，要从留意自己的想法、感受和选择开始。每天找一点安静的时间，问问什么给了你力量，什么让你感到不舒服。你不必一次改变所有事情；真诚地关注自己就是第一步。"}},{"title":"Discover Your Strengths","texts":{"en":"Strengths are not only talents such as singing or drawing. Patience, kindness, curiosity, reliability, and courage are strengths too. Remember a moment when you helped someone or solved a problem, then write down what you did well and use that ability again.","my":"အားသာချက်ဆိုတာ သီချင်းဆိုတာ၊ ပန်းချီဆွဲတာလို ပါရမီတွေချည်း မဟုတ်ပါဘူး။ စိတ်ရှည်ခြင်း၊ ကြင်နာခြင်း၊ စူးစမ်းလိုစိတ်၊ ယုံကြည်စိတ်ချရခြင်းနဲ့ သတ္တိတို့လည်း အားသာချက်တွေပါ။ တစ်ယောက်ယောက်ကို ကူညီခဲ့တဲ့အချိန် ဒါမှမဟုတ် ပြဿနာဖြေရှင်းနိုင်ခဲ့တဲ့အချိန်ကို ပြန်စဉ်းစားပြီး ကိုယ်ကောင်းကောင်းလုပ်နိုင်တာကို ရေးပါ။","ko":"강점은 노래나 그림 같은 재능만이 아닙니다. 인내심, 친절함, 호기심, 책임감과 용기도 강점입니다. 누군가를 도왔거나 문제를 해결했던 순간을 떠올리고 잘했던 일을 적어 보세요. 그 능력을 다시 활용해 보세요.","zh":"优点不只是唱歌或画画这样的才能。耐心、善良、好奇心、可靠和勇气也都是优点。回想帮助别人或解决问题的时刻，写下自己做得好的地方，并再次发挥这些能力。"}},{"title":"Accept Your Weaknesses","texts":{"en":"Everyone has something to improve. A weakness is not proof that you are a failure; it is information that can guide your growth. Choose one area to work on and make the next step small. Ask for help when you need it, and speak to yourself with respect.","my":"လူတိုင်းမှာ တိုးတက်အောင်လုပ်ဖို့ လိုအပ်တဲ့အရာ ရှိပါတယ်။ အားနည်းချက်ရှိတာဟာ မအောင်မြင်သူဖြစ်ကြောင်း သက်သေမဟုတ်ဘဲ တိုးတက်ဖို့ လမ်းညွှန်ပေးတဲ့ အချက်အလက်ပါ။ ပြုပြင်ချင်တဲ့အပိုင်းတစ်ခုကို ရွေးပြီး သေးငယ်တဲ့ခြေလှမ်းနဲ့ စပါ။ လိုအပ်ရင် အကူအညီတောင်းပြီး ကိုယ့်ကိုယ်ကို လေးစားစွာ ပြောဆိုပါ။","ko":"누구에게나 발전이 필요한 부분이 있습니다. 약점이 있다고 해서 실패한 사람이라는 뜻은 아닙니다. 그것은 성장의 방향을 알려 주는 정보입니다. 개선할 한 가지를 고르고 작은 단계부터 시작하세요. 필요하면 도움을 요청하고 자신을 존중하세요.","zh":"每个人都有需要改进的地方。弱点并不代表你是失败者，而是帮助你成长的信息。选择一个想改善的方面，从小步骤开始。需要时寻求帮助，也要尊重自己。"}},{"title":"Know Your Values","texts":{"en":"Values are the principles that guide your choices. You may value honesty, family, learning, freedom, or helping others. Think of a decision that made you proud and ask which value guided it. Choose three values that matter most and use them as a compass when life feels confusing.","my":"တန်ဖိုးထားမှုတွေဟာ ကိုယ့်ရွေးချယ်မှုကို လမ်းညွှန်ပေးတဲ့ မူဝါဒတွေပါ။ ရိုးသားမှု၊ မိသားစု၊ သင်ယူမှု၊ လွတ်လပ်မှု ဒါမှမဟုတ် အခြားသူကို ကူညီမှုတို့ကို တန်ဖိုးထားနိုင်ပါတယ်။ ကိုယ်ဂုဏ်ယူမိတဲ့ ဆုံးဖြတ်ချက်တစ်ခုကို စဉ်းစားပြီး ဘယ်တန်ဖိုးက လမ်းညွှန်ခဲ့သလဲ မေးပါ။ အရေးကြီးဆုံး တန်ဖိုးသုံးခုကို ရွေးထားပါ။","ko":"가치는 선택을 이끄는 원칙입니다. 정직, 가족, 배움, 자유, 다른 사람 돕기를 중요하게 여길 수 있습니다. 자랑스러웠던 결정을 떠올리고 어떤 가치가 이끌었는지 생각해 보세요. 가장 중요한 가치 세 가지를 골라 혼란스러울 때 나침반으로 삼으세요.","zh":"价值观是引导你做选择的原则。你可能重视诚实、家庭、学习、自由或帮助他人。回想一个让你自豪的决定，想想是什么价值引导了它。选出最重要的三个价值观，在困惑时把它们当作指南。"}},{"title":"Understand Your Emotions","texts":{"en":"Emotions carry messages. Anger may point to a boundary, sadness may show that something matters, and fear may remind you to prepare. Pause before reacting, name the feeling, and notice what happened. Then choose a response that helps rather than harms.","my":"ခံစားချက်တွေမှာ ပြောပြချင်တဲ့ အကြောင်းအရာတွေ ရှိပါတယ်။ ဒေါသက ကိုယ့်နယ်နိမိတ်ကို ပြသနိုင်ပြီး ဝမ်းနည်းမှုက အရေးကြီးတဲ့အရာတစ်ခုရှိကြောင်း ပြနိုင်ပါတယ်။ ချက်ချင်းမတုံ့ပြန်ဘဲ ခဏရပ်ပါ၊ ခံစားချက်ကို နာမည်တပ်ပြီး ဘာဖြစ်ခဲ့သလဲ သတိထားပါ။ ထိခိုက်စေမယ့်အစား အထောက်အကူဖြစ်စေမယ့် တုံ့ပြန်မှုကို ရွေးပါ။","ko":"감정에는 메시지가 담겨 있습니다. 분노는 경계가 필요하다는 신호일 수 있고 슬픔은 소중한 것이 있다는 뜻일 수 있습니다. 반응하기 전에 잠시 멈추고 감정에 이름을 붙인 뒤 무슨 일이 있었는지 살펴보세요. 해가 아니라 도움이 되는 반응을 선택하세요.","zh":"情绪会传递信息。愤怒可能提醒你需要界限，悲伤可能说明某件事很重要。回应之前先停一停，说出自己的感受，并留意发生了什么。然后选择有帮助而不是有伤害的回应。"}},{"title":"Find Your Direction","texts":{"en":"A direction does not need to be a perfect life plan. Think about the person you want to become and choose one goal for the next three months. Write why it matters, the first small step, and who can support you. Review the goal each week and adjust it as you learn.","my":"人生方向不需要是一份完美的计划。想想自己想成成为 ဘယ်လိုလူတစ်ယောက်ဖြစ်ချင်သလဲဆိုတာနဲ့ နောက်သုံးလအတွက် ရည်မှန်းချက်တစ်ခု ရွေးပါ။ ဘာကြောင့်အရေးကြီးသလဲ၊ ပထမဆုံးခြေလှမ်းက ဘာလဲ၊ ဘယ်သူက ကူညီနိုင်သလဲ ရေးပါ။ အပတ်တိုင်း ပြန်သုံးသပ်ပြီး အသစ်သိလာတာအလိုက် ပြင်ဆင်ပါ။","ko":"방향을 정하는 데 완벽한 인생 계획은 필요하지 않습니다. 어떤 사람이 되고 싶은지 생각하고 앞으로 석 달 동안의 목표 하나를 정하세요. 왜 중요한지, 첫걸음은 무엇인지, 누가 도와줄 수 있는지 적으세요. 매주 돌아보고 새롭게 배운 것에 맞게 조정하세요.","zh":"人生方向不需要是一份完美计划。想想自己想成为什么样的人，并为未来三个月选定一个目标。写下它为什么重要、第一步是什么，以及谁能支持你。每周回顾，并根据新的认识作出调整。"}},{"title":"Build Self-Confidence","texts":{"en":"Confidence grows when you keep promises to yourself. Start with a task small enough to finish, such as reading for ten minutes or practising a skill. Notice your effort, not only the result. When you make a mistake, learn from it and try again.","my":"ကိုယ့်ကိုယ်ကို ယုံကြည်မှုဟာ ကိုယ့်ကိုယ်ကို ပေးထားတဲ့ ကတိတွေကို တည်မြဲစွာ လုပ်ဆောင်ခြင်းကနေ တိုးလာပါတယ်။ ဆယ်မိနစ်စာဖတ်ခြင်းလို ပြီးမြောက်နိုင်တဲ့ အလုပ်သေးသေးလေးနဲ့ စပါ။ ရလဒ်တစ်ခုတည်းမဟုတ်ဘဲ ကြိုးစားမှုကိုလည်း သတိထားပါ။ အမှားလုပ်မိရင် သင်ခန်းစာယူပြီး ပြန်ကြိုးစားပါ။","ko":"자신감은 스스로와 한 약속을 지킬 때 자랍니다. 10분 독서처럼 끝낼 수 있는 작은 일부터 시작하세요. 결과뿐 아니라 노력도 알아주세요. 실수하면 배우고 다시 시도하세요.","zh":"当你遵守对自己的承诺时，自信就会成长。从能够完成的小事开始，例如阅读十分钟或练习一项技能。关注努力，而不只看结果。犯错时从中学习，再试一次。"}},{"title":"Protect Your Attention","texts":{"en":"Attention is valuable. Notice what distracts you, such as endless scrolling or trying to do too many tasks at once. Set a short period to focus on one important activity and put your phone aside if possible. Rest when needed, then return with a clearer mind.","my":"အာရုံစူးစိုက်နိုင်စွမ်းဟာ တန်ဖိုးရှိပါတယ်။ ဖုန်းအဆုံးမရှိကြည့်ခြင်း ဒါမှမဟုတ် အလုပ်များစွာ တစ်ပြိုင်နက်လုပ်ခြင်းလို အာရုံပျံ့လွင့်စေတဲ့အရာတွေကို သတိထားပါ။ အရေးကြီးတဲ့အလုပ်တစ်ခုအတွက် အချိန်တိုတစ်ခု သတ်မှတ်ပြီး ဖြစ်နိုင်ရင် ဖုန်းကို ဘေးချထားပါ။ လိုအပ်ရင် အနားယူပြီး စိတ်ကြည်လင်လာတဲ့အခါ ပြန်စပါ။","ko":"집중력은 소중합니다. 끝없이 화면을 보거나 한꺼번에 너무 많은 일을 하는 것처럼 집중을 빼앗는 요소를 살펴보세요. 중요한 활동 하나에 집중할 짧은 시간을 정하고 가능하면 휴대전화를 멀리 두세요. 필요할 때 쉬고 맑은 마음으로 다시 시작하세요.","zh":"注意力很宝贵。留意什么会分散注意力，例如不停刷手机或同时做太多事情。为一项重要活动安排一段专注时间，如果可以，把手机放到一边。需要时休息，再以清醒的头脑继续。"}},{"title":"Learn From Your Past","texts":{"en":"Your past contains experiences, not a permanent definition of who you are. Look back without attacking yourself. Ask what a difficult moment taught you and what you would do differently now. Keep the lesson and release repeated blame. You are allowed to grow beyond an old mistake.","my":"အတိတ်မှာ အတွေ့အကြုံတွေ ရှိပေမဲ့ အဲဒါတွေက ကိုယ်ဘယ်သူဖြစ်တယ်ဆိုတာကို အပြီးသတ် မသတ်မှတ်ပါဘူး။ ကိုယ့်ကိုယ်ကို အပြစ်မတင်ဘဲ ပြန်ကြည့်ပါ။ ခက်ခဲတဲ့အချိန်တစ်ခုက ဘာသင်ပေးခဲ့သလဲ၊ အခုဆို ဘာကို မတူအောင်လုပ်မလဲ မေးပါ။ သင်ခန်းစာကို သိမ်းထားပြီး ကိုယ့်ကိုယ်ကို အပြစ်တင်နေခြင်းကို လွှတ်ချပါ။","ko":"과거는 경험을 담고 있지만 당신을 영원히 규정하지는 않습니다. 자신을 공격하지 말고 돌아보세요. 어려운 순간이 무엇을 가르쳐 주었는지, 지금이라면 무엇을 다르게 할지 생각하세요. 교훈은 간직하고 반복적인 자책은 내려놓으세요.","zh":"过去包含经历，但不能永远定义你是谁。回顾时不要攻击自己。想想困难教会了你什么，以及现在会怎样做得不同。留下教训，放下反复自责。你可以成长，不再被旧错误限制。"}},{"title":"Reflect Every Day","texts":{"en":"Reflection turns ordinary days into learning. At night, ask: What went well? What was difficult? What is one thing I can try tomorrow? Write a few honest lines. Over time, your notes can reveal patterns and progress that are hard to notice in the moment.","my":"ပြန်လည်သုံးသပ်ခြင်းက နေ့စဉ်ဘဝကို သင်ယူမှုအဖြစ် ပြောင်းလဲပေးပါတယ်။ ညဘက်မှာ ဒီနေ့ ဘာကောင်းခဲ့သလဲ၊ ဘာခက်ခဲခဲ့သလဲ၊ မနက်ဖြန် ဘာတစ်ခု စမ်းလုပ်နိုင်မလဲ မေးပါ။ ရိုးသားတဲ့ စာကြောင်းအနည်းငယ် ရေးပါ။ အချိန်ကြာလာရင် ကိုယ်မမြင်မိတဲ့ တိုးတက်မှုတွေကို မှတ်စုတွေက ပြသပေးပါလိမ့်မယ်။","ko":"성찰은 평범한 하루를 배움으로 바꿉니다. 밤에 무엇이 잘되었는지, 무엇이 어려웠는지, 내일 시도할 한 가지는 무엇인지 물어보세요. 솔직한 문장을 몇 줄 적으세요. 시간이 지나면 기록에서 알아차리기 어려웠던 발전을 볼 수 있습니다.","zh":"反思能把平凡的一天变成学习。晚上问自己：今天什么做得好？什么很困难？明天可以尝试什么？写下几句真实的想法。随着时间过去，笔记会帮助你看见不容易察觉的进步。"}}]},{"title":"Build Good Habits","icon":"⭐","category":"Personal Growth","chapters":[{"title":"Start Small","texts":{"en":"Big changes often begin with actions so small they seem easy to ignore. Read one page, save a little money, or walk for five minutes. Repeat the action until it feels familiar, then increase it gradually. Consistency is more useful than a large plan you cannot maintain.","my":"ကြီးမားတဲ့ ပြောင်းလဲမှုတွေဟာ သေးငယ်တဲ့ လုပ်ဆောင်ချက်ကနေ စတင်တတ်ပါတယ်။ စာတစ်မျက်နှာဖတ်ပါ၊ ငွေအနည်းငယ်စုပါ၊ ငါးမိနစ်လမ်းလျှောက်ပါ။ အကျွမ်းတဝင်ဖြစ်လာတဲ့အထိ ထပ်လုပ်ပြီးမှ တဖြည်းဖြည်း တိုးပါ။ မထိန်းသိမ်းနိုင်တဲ့ အစီအစဉ်ကြီးထက် တစိုက်မတ်မတ်လုပ်ခြင်းက ပိုအသုံးဝင်ပါတယ်။","ko":"큰 변화는 아주 작은 행동에서 시작되기도 합니다. 한 페이지를 읽고, 돈을 조금 저축하거나, 5분 걸어 보세요. 익숙해질 때까지 반복한 뒤 조금씩 늘리세요. 지킬 수 없는 큰 계획보다 꾸준함이 더 중요합니다.","zh":"大的改变往往从很小的行动开始。读一页书、存一点钱，或散步五分钟。重复到熟悉之后，再慢慢增加。坚持比无法维持的宏大计划更有用。"}},{"title":"Create a Daily Routine","texts":{"en":"A routine reduces the number of decisions you must make. Choose one simple morning habit and one evening habit. Prepare something the night before and review tomorrow's priorities in the morning. Keep the routine realistic for your work, energy, and responsibilities.","my":"နေ့စဉ်လုပ်ရိုးလုပ်စဉ်တစ်ခုက ဆုံးဖြတ်ချက်ချရတဲ့ အကြိမ်ရေကို လျှော့ချပေးပါတယ်။ မနက်ပိုင်းအလေ့အကျင့်တစ်ခုနဲ့ ညပိုင်းအလေ့အကျင့်တစ်ခု ရွေးပါ။ ညဘက်မှာ လိုအပ်တာပြင်ဆင်ပြီး မနက်မှာ အရေးကြီးတာတွေ ပြန်ကြည့်ပါ။ ကိုယ့်အလုပ်၊ အားအင်နဲ့ တာဝန်တွေနဲ့ ကိုက်ညီအောင် လက်တွေ့ကျစေပါ။","ko":"일과는 매번 내려야 하는 결정의 수를 줄여 줍니다. 간단한 아침 습관과 저녁 습관을 하나씩 정하세요. 전날 밤에 필요한 것을 준비하고 아침에 우선순위를 확인하세요. 일과 에너지, 책임에 맞게 현실적으로 만드세요.","zh":"日常规律能减少你需要做出的决定。选择一个简单的早晨习惯和一个晚间习惯。前一晚准备好需要的东西，早上查看重点。让计划符合你的工作、精力和责任。"}},{"title":"Manage Your Time","texts":{"en":"Time management begins by knowing what matters. Each day, choose up to three important tasks. Do meaningful work when your energy is strongest, if your schedule allows. Leave space for meals, rest, travel, and unexpected events. A realistic plan gives direction without controlling every minute.","my":"အချိန်စီမံခန့်ခွဲခြင်းဟာ ဘာအရေးကြီးသလဲ သိခြင်းကနေ စတင်ပါတယ်။ နေ့တိုင်း အရေးကြီးတဲ့အလုပ် သုံးခုအထိ ရွေးပါ။ အချိန်ဇယားအဆင်ပြေရင် အားအင်အကောင်းဆုံးအချိန်မှာ အရေးကြီးတဲ့အလုပ်ကို လုပ်ပါ။ စားချိန်၊ အနားယူချိန်၊ သွားလာချိန်နဲ့ မမျှော်လင့်ထားတဲ့ကိစ္စတွေအတွက် နေရာချန်ထားပါ။","ko":"시간 관리는 무엇이 중요한지 아는 데서 시작됩니다. 매일 중요한 일을 최대 세 가지 고르세요. 일정이 허락한다면 에너지가 좋을 때 의미 있는 일을 하세요. 식사, 휴식, 이동과 예상치 못한 일을 위한 여유도 남겨 두세요.","zh":"时间管理从了解什么最重要开始。每天最多选出三件重要任务。如果时间允许，在精力充沛时完成重要工作。为吃饭、休息、通勤和突发事件留出空间。现实的计划能提供方向，而不是控制每一分钟。"}},{"title":"Build a Reading Habit","texts":{"en":"Reading becomes easier when it has a regular place in your day. Keep a book near your resting place or read a few pages during a quiet break. Choose a subject you genuinely want to understand. After reading, explain one idea in your own words. The goal is learning, not speed.","my":"စာဖတ်ခြင်းကို နေ့စဉ်အချိန်ဇယားထဲမှာ နေရာတစ်ခု သတ်မှတ်ပေးရင် ပိုလွယ်လာပါတယ်။ အနားယူတဲ့နေရာမှာ စာအုပ်ထားပါ၊ ဒါမှမဟုတ် နားချိန်မှာ စာမျက်နှာအနည်းငယ်ဖတ်ပါ။ ကိုယ်တကယ်နားလည်ချင်တဲ့ အကြောင်းအရာကို ရွေးပါ။ ဖတ်ပြီးရင် အကြံတစ်ခုကို ကိုယ့်စကားနဲ့ ပြန်ရှင်းပြပါ။ ရည်ရွယ်ချက်က မြန်မြန်ဖတ်ဖို့မဟုတ်ဘဲ သင်ယူဖို့ပါ။","ko":"독서는 하루에 정해진 자리를 만들면 더 쉬워집니다. 쉬는 곳에 책을 두거나 조용한 휴식 시간에 몇 페이지 읽으세요. 정말 알고 싶은 주제를 고르세요. 읽은 뒤 한 가지 생각을 자신의 말로 설명해 보세요. 목표는 속도가 아니라 배움입니다.","zh":"当阅读在一天中有固定位置时，就会更容易。把书放在休息的地方，或在安静的休息时间读几页。选择真正想了解的主题。读完后，用自己的话解释一个观点。目标是学习，而不是速度。"}},{"title":"Save Money Consistently","texts":{"en":"Saving works best when it is planned before spending. Decide on a realistic amount from each pay period, even if it is small. Keep it separate and track your progress. Start with a small emergency fund for unexpected needs. Do not compare your savings with someone else's situation.","my":"ငွေစုခြင်းဟာ ငွေမသုံးခင်ကတည်းက စီစဉ်ထားရင် အကောင်းဆုံးပါ။ လစာရတိုင်း ပမာဏသေးငယ်ရင်တောင် လက်တွေ့ကျတဲ့ ပမာဏတစ်ခု သတ်မှတ်ပါ။ သီးခြားထားပြီး တိုးတက်မှုကို မှတ်တမ်းတင်ပါ။ မမျှော်လင့်ထားတဲ့ လိုအပ်ချက်တွေအတွက် အရေးပေါ်ငွေစုလေးကို အရင်တည်ဆောက်ပါ။ ကိုယ့်အခြေအနေကို တခြားသူနဲ့ မနှိုင်းယှဉ်ပါနဲ့။","ko":"저축은 지출하기 전에 계획할 때 가장 효과적입니다. 급여를 받을 때마다 적은 금액이라도 현실적인 액수를 정하세요. 따로 보관하고 진행 상황을 기록하세요. 예상치 못한 필요에 대비한 작은 비상금을 먼저 만드세요. 다른 사람의 상황과 저축을 비교하지 마세요.","zh":"先计划储蓄，再安排消费，效果会更好。每次领薪水时，设定一个现实的金额，即使很少也可以。把钱单独存放并记录进度。先建立一笔小额应急储备。不要拿自己的储蓄和别人的情况比较。"}},{"title":"Reduce Distractions","texts":{"en":"Make focus easier by changing your environment. Silence unnecessary notifications, clear your work surface, and keep only what you need nearby. Try focusing for twenty minutes, then take a short break. If you reach for your phone automatically, pause and remember your intention.","my":"ပတ်ဝန်းကျင်ကို ပြောင်းလဲခြင်းဖြင့် အာရုံစူးစိုက်ဖို့ ပိုလွယ်အောင်လုပ်နိုင်ပါတယ်။ မလိုအပ်တဲ့ အသိပေးချက်တွေ ပိတ်ပါ၊ အလုပ်နေရာကို ရှင်းပါ၊ လိုအပ်တာတွေပဲ အနီးမှာထားပါ။ မိနစ်နှစ်ဆယ် အာရုံစိုက်ပြီး ခဏနားပါ။ အလိုအလျောက် ဖုန်းယူမိရင် ခဏရပ်ပြီး ကိုယ်ဘာလုပ်ဖို့ ရည်ရွယ်ထားသလဲ ပြန်သတိရပါ။","ko":"환경을 바꾸면 집중하기가 쉬워집니다. 불필요한 알림을 끄고 작업 공간을 정리하며 필요한 것만 가까이 두세요. 20분 동안 집중한 뒤 짧게 쉬어 보세요. 무의식적으로 휴대전화를 집어 들면 잠시 멈추고 원래 목적을 떠올리세요.","zh":"改变环境能让专注更容易。关闭不必要的通知，整理工作区域，只把需要的东西放在身边。尝试专注二十分钟，然后短暂休息。如果下意识拿起手机，先停下来想想原本的目的。"}},{"title":"Take Care of Your Body","texts":{"en":"Healthy habits are easier to maintain when they are practical. Drink water regularly, choose nourishing food when available, move in a way you enjoy, and protect your sleep as much as possible. You do not need an extreme routine. Start with one supportive choice and repeat it.","my":"ကျန်းမာရေးအလေ့အကျင့်တွေကို လက်တွေ့ကျအောင်လုပ်ထားရင် ထိန်းသိမ်းရ ပိုလွယ်ပါတယ်။ ရေမှန်မှန်သောက်ပါ၊ ရနိုင်တဲ့အခါ အာဟာရရှိတဲ့အစားအစာ ရွေးပါ၊ နှစ်သက်တဲ့နည်းနဲ့ ကိုယ်လက်လှုပ်ရှားပါ၊ အိပ်စက်မှုကို ဂရုစိုက်ပါ။ အလွန်အကျွံလုပ်ဖို့ မလိုပါဘူး။ အထောက်အကူဖြစ်စေမယ့် ရွေးချယ်မှုတစ်ခုနဲ့ စတင်ပါ။","ko":"건강한 습관은 현실적일수록 유지하기 쉽습니다. 물을 규칙적으로 마시고, 가능할 때 영양 있는 음식을 먹고, 좋아하는 방식으로 몸을 움직이며, 수면을 지키세요. 극단적인 일과는 필요하지 않습니다. 도움이 되는 선택 하나부터 반복하세요.","zh":"健康习惯越实际，就越容易坚持。规律喝水，有条件时选择有营养的食物，用喜欢的方式活动身体，并尽量保证睡眠。你不需要极端的计划。从一个有益的选择开始并重复它。"}},{"title":"Keep Learning","texts":{"en":"Learning happens outside classrooms too. You can learn from books, conversations, mistakes, work, and careful observation. Choose one skill and practise it a little each week. Ask questions and look for trustworthy explanations. Keep notes so you can see how far you have come.","my":"သင်ယူခြင်းဟာ စာသင်ခန်းထဲမှာပဲ မဟုတ်ပါဘူး။ စာအုပ်တွေ၊ စကားပြောဆိုမှုတွေ၊ အမှားတွေ၊ အလုပ်နဲ့ လေ့လာကြည့်ရှုခြင်းတွေကနေ သင်ယူနိုင်ပါတယ်။ ကျွမ်းကျင်မှုတစ်ခု ရွေးပြီး အပတ်တိုင်း အနည်းငယ်လေ့ကျင့်ပါ။ မေးခွန်းမေးပြီး ယုံကြည်စိတ်ချရတဲ့ ရှင်းလင်းချက်တွေ ရှာပါ။ သင်ယူခဲ့တာတွေကို မှတ်စုရေးထားပါ။","ko":"배움은 교실 밖에서도 일어납니다. 책, 대화, 실수, 일, 관찰을 통해 배울 수 있습니다. 기술 하나를 골라 매주 조금씩 연습하세요. 질문하고 신뢰할 수 있는 설명을 찾아보세요. 기록을 남기면 얼마나 성장했는지 알 수 있습니다.","zh":"学习不只发生在教室里。你可以从书籍、对话、错误、工作和观察中学习。选择一项技能，每周练习一点。多提问，并寻找可信的解释。记录学到的内容，就能看见自己的进步。"}},{"title":"Recover After a Setback","texts":{"en":"Missing one day does not erase your progress. Habits grow through repeated attempts, not perfect streaks. If you miss a planned action, notice why and make the next step easier. Restart at the next opportunity instead of waiting for Monday. Returning is part of the habit.","my":"တစ်ရက်လွတ်သွားတာနဲ့ တိုးတက်မှုအားလုံး ပျောက်မသွားပါဘူး။ အလေ့အကျင့်ဆိုတာ ပြီးပြည့်စုံတဲ့ ဆက်တိုက်လုပ်ဆောင်မှုထက် အကြိမ်ကြိမ်ကြိုးစားမှုနဲ့ တည်ဆောက်တာပါ။ မလုပ်နိုင်ခဲ့ရင် ဘာကြောင့်လဲ သတိထားပြီး နောက်တစ်ဆင့်ကို ပိုလွယ်အောင် ပြင်ပါ။ နောက်အခွင့်အရေးမှာ ပြန်စပါ။ ပြန်လာခြင်းကလည်း အလေ့အကျင့်ရဲ့ အစိတ်အပိုင်းပါ။","ko":"하루를 놓쳤다고 발전이 사라지는 것은 아닙니다. 습관은 완벽한 연속 기록이 아니라 반복된 시도로 만들어집니다. 계획한 행동을 못 했다면 이유를 살피고 다음 단계를 쉽게 만드세요. 월요일을 기다리지 말고 다음 기회에 다시 시작하세요.","zh":"错过一天并不会抹去进步。习惯靠反复尝试建立，而不是靠完美的连续记录。如果没能完成计划，看看原因，并让下一步更容易。下次有机会就重新开始，不必等到星期一。"}},{"title":"Review and Improve","texts":{"en":"Once a week, review the habits you are building. Which felt easy? Which was difficult? Did your schedule make it harder? Keep what works and adjust what does not. Celebrate effort, such as showing up or trying again. A good system improves as you learn about yourself.","my":"တစ်ပတ်တစ်ကြိမ် ကိုယ်တည်ဆောက်နေတဲ့ အလေ့အကျင့်တွေကို ပြန်သုံးသပ်ပါ။ ဘယ်အရာက လွယ်ကူသလဲ၊ ဘယ်အရာက ခက်ခဲသလဲ၊ အချိန်ဇယားကြောင့် ပိုခက်သွားသလား မေးပါ။ အလုပ်ဖြစ်တာကို ဆက်ထားပြီး မဖြစ်တာကို ပြင်ပါ။ ပြန်ကြိုးစားနိုင်မှုအပါအဝင် ကိုယ့်ကြိုးစားမှုကို ဂုဏ်ပြုပါ။ ကိုယ့်အကြောင်း ပိုသိလာတာနဲ့အမျှ စနစ်လည်း ပိုကောင်းလာသင့်ပါတယ်။","ko":"일주일에 한 번 습관을 돌아보세요. 어떤 것이 쉬웠나요? 무엇이 어려웠나요? 일정 때문에 더 힘들었나요? 잘되는 것은 유지하고 그렇지 않은 것은 조정하세요. 다시 시도한 노력도 축하하세요. 자신을 더 알아갈수록 좋은 시스템도 발전합니다.","zh":"每周回顾一次正在培养的习惯。哪一个容易？哪一个困难？日程是否增加了难度？保留有效的方法，调整无效的方法。为自己的努力庆祝，包括再次尝试。随着你更了解自己，好的系统也会不断改善。"}}]},{"title":"A Better Life","icon":"🌸","category":"Life & Happiness","chapters":[{"title":"Begin With Gratitude","texts":{"en":"Gratitude does not mean pretending everything is easy. It means noticing what is still good while you work through difficulties. You might appreciate a safe place to rest, a meal, a kind message, or another chance to try. Write down one thing you appreciate each day.","my":"ကျေးဇူးတင်တတ်ခြင်းဆိုတာ အရာအားလုံး လွယ်ကူနေသလို ဟန်ဆောင်ခြင်း မဟုတ်ပါဘူး။ အခက်အခဲတွေကြားမှာတောင် ကောင်းမွန်နေသေးတဲ့အရာတွေကို သတိထားခြင်းပါ။ အနားယူလို့ရတဲ့နေရာ၊ အစားအစာတစ်နပ်၊ ကြင်နာတဲ့စာတို ဒါမှမဟုတ် ထပ်ကြိုးစားခွင့်ရတာကို တန်ဖိုးထားနိုင်ပါတယ်။ နေ့တိုင်း ကျေးဇူးတင်ရတဲ့အရာတစ်ခု ရေးပါ။","ko":"감사는 모든 일이 쉽다고 가장하는 것이 아닙니다. 어려움 속에서도 여전히 좋은 것을 알아차리는 것입니다. 쉴 수 있는 안전한 곳, 식사, 친절한 메시지, 다시 시도할 기회에 감사할 수 있습니다. 매일 감사한 것 한 가지를 적어 보세요.","zh":"感恩不是假装一切都很容易，而是在困难中仍看见美好的事物。你可以感谢一个安全的休息空间、一顿饭、一条友善的信息，或再次尝试的机会。每天写下一件值得感谢的事。"}},{"title":"Care for Relationships","texts":{"en":"Strong relationships grow through attention and respect. Listen without rushing to answer, keep promises when you can, and speak honestly without being cruel. Make time for people who treat you with care. Healthy relationships also allow boundaries, so you can kindly say no when needed.","my":"ခိုင်မာတဲ့ ဆက်ဆံရေးတွေဟာ အာရုံစိုက်မှုနဲ့ လေးစားမှုကနေ ကြီးထွားလာပါတယ်။ ပြန်ဖြေဖို့ အလျင်မလိုဘဲ နားထောင်ပါ၊ တတ်နိုင်သလောက် ကတိတည်ပါ၊ မရိုင်းစိုင်းဘဲ ရိုးသားစွာ ပြောပါ။ ကိုယ့်ကို ဂရုစိုက်တဲ့သူတွေအတွက် အချိန်ပေးပါ။ ကျန်းမာတဲ့ဆက်ဆံရေးမှာ ကိုယ့်နယ်နိမိတ်ရှိပြီး လိုအပ်ရင် ကြင်နာစွာ ငြင်းနိုင်ပါတယ်။","ko":"좋은 관계는 관심과 존중을 통해 자랍니다. 서둘러 대답하지 말고 듣고, 가능하면 약속을 지키며, 잔인하지 않게 솔직하게 말하세요. 당신을 소중히 대하는 사람들에게 시간을 쓰세요. 건강한 관계에는 경계도 필요하므로 필요할 때 친절하게 거절할 수 있습니다.","zh":"良好的关系通过关注和尊重成长。认真倾听，不急着回答；尽可能遵守承诺；诚实表达但不要刻薄。把时间留给真心关心你的人。健康的关系也需要界限，所以必要时可以友善地拒绝。"}},{"title":"Find Balance at Work","texts":{"en":"Work matters, but it is only one part of life. Make room for rest, relationships, learning, and activities that bring meaning when possible. Notice signs of exhaustion and take breaks before reaching your limit. Even a short peaceful routine after work can help you recover.","my":"အလုပ်ဟာ အရေးကြီးပေမဲ့ ဘဝရဲ့ အစိတ်အပိုင်းတစ်ခုသာ ဖြစ်ပါတယ်။ ဖြစ်နိုင်သလောက် အနားယူချိန်၊ ဆက်ဆံရေး၊ သင်ယူမှုနဲ့ အဓိပ္ပာယ်ရှိစေတဲ့ လှုပ်ရှားမှုတွေအတွက် နေရာချန်ပါ။ ပင်ပန်းလွန်းတဲ့ လက္ခဏာတွေကို သတိထားပြီး အကန့်အသတ်မရောက်ခင် နားပါ။ အလုပ်ပြီးနောက် တိတ်ဆိတ်တဲ့ အလေ့အကျင့်တိုလေးက ပြန်လည်အားဖြည့်ပေးနိုင်ပါတယ်။","ko":"일은 중요하지만 삶의 한 부분일 뿐입니다. 가능하다면 휴식, 관계, 배움, 의미 있는 활동을 위한 공간을 만드세요. 지쳤다는 신호를 알아차리고 한계에 도달하기 전에 쉬세요. 퇴근 후 짧고 평화로운 일과도 회복에 도움이 됩니다.","zh":"工作很重要，但它只是生活的一部分。尽可能为休息、人际关系、学习和有意义的活动留出空间。留意疲惫的信号，在达到极限前休息。下班后一个简短而平静的习惯也能帮助你恢复。"}},{"title":"Spend Time in Nature","texts":{"en":"Nature invites you to slow down and notice the world around you. Walk in a park, watch the sky, or sit near trees when it is safe and possible. Put your phone away for a few minutes and pay attention to sounds, light, and fresh air. You do not need a long trip to enjoy the outdoors.","my":"သဘာဝတရားက အရှိန်လျှော့ပြီး ပတ်ဝန်းကျင်ကို သတိထားကြည့်ဖို့ ဖိတ်ခေါ်ပါတယ်။ လုံခြုံပြီး အဆင်ပြေရင် ပန်းခြံထဲ လမ်းလျှောက်ပါ၊ ကောင်းကင်ကို ကြည့်ပါ၊ သစ်ပင်အနီးမှာ ထိုင်ပါ။ မိနစ်အနည်းငယ် ဖုန်းကို ဘေးချပြီး အသံတွေ၊ အလင်းရောင်နဲ့ လေကောင်းလေသန့်ကို ခံစားပါ။ သဘာဝကို ခံစားဖို့ ခရီးရှည် မလိုပါဘူး။","ko":"자연은 속도를 늦추고 주변을 바라보게 합니다. 안전하고 가능하다면 공원을 걷거나 하늘을 보거나 나무 곁에 앉아 보세요. 몇 분 동안 휴대전화를 치우고 소리와 빛, 신선한 공기에 집중하세요. 자연을 즐기기 위해 긴 여행이 필요한 것은 아닙니다.","zh":"大自然能让你放慢脚步，留意周围的世界。在安全方便时，到公园散步、看看天空，或坐在树旁。把手机放到一边几分钟，感受声音、光线和新鲜空气。享受户外并不需要长途旅行。"}},{"title":"Respond to Stress","texts":{"en":"Stress is a signal to pause and understand what is happening. Take a few slow breaths, relax your shoulders, and name your main concern. Separate what you can influence from what you cannot control. Choose one practical next action. If stress feels overwhelming or lasts a long time, talk with someone you trust or a qualified professional.","my":"စိတ်ဖိစီးမှုဟာ ခဏရပ်ပြီး ဘာတွေဖြစ်နေသလဲ နားလည်ဖို့ သတိပေးချက်ပါ။ အသက်ကို ဖြည်းဖြည်းရှူထုတ်ပါ၊ ပခုံးတွေကို ဖြေလျှော့ပြီး အဓိကစိုးရိမ်ချက်ကို နာမည်တပ်ပါ။ ကိုယ်သက်ရောက်မှုရှိနိုင်တာနဲ့ မထိန်းချုပ်နိုင်တာကို ခွဲပါ။ လက်တွေ့ကျတဲ့ နောက်တစ်ဆင့်တစ်ခု ရွေးပါ။ အလွန်ပြင်းထန်နေပါက ယုံကြည်ရသူ သို့မဟုတ် ကျွမ်းကျင်သူနဲ့ ဆွေးနွေးပါ။","ko":"스트레스는 잠시 멈추고 상황을 이해하라는 신호입니다. 천천히 숨을 쉬고 어깨를 풀며 가장 큰 걱정이 무엇인지 이름 붙여 보세요. 바꿀 수 있는 것과 통제할 수 없는 것을 구분하세요. 실천 가능한 다음 행동 하나를 선택하세요. 스트레스가 감당하기 어렵거나 오래 지속되면 믿을 만한 사람이나 전문가와 이야기하세요.","zh":"压力是在提醒你停下来，了解正在发生什么。慢慢深呼吸，放松肩膀，说出最主要的担忧。区分自己能够影响的事情和无法控制的事情。选择一个实际的下一步。如果压力难以承受或持续很久，可以与信任的人或专业人士谈谈。"}},{"title":"Make Room for Joy","texts":{"en":"Joy does not have to be expensive or impressive. It may come from music, cooking, conversation, a favourite story, or learning something new. Notice which activities leave you refreshed rather than drained. Put one enjoyable activity into your week and protect that time when possible.","my":"ပျော်ရွှင်မှုရဖို့ ဈေးကြီးတဲ့အရာတွေ မလိုပါဘူး။ သီချင်းနားထောင်ခြင်း၊ ချက်ပြုတ်ခြင်း၊ စကားပြောခြင်း၊ နှစ်သက်တဲ့ဇာတ်လမ်းဖတ်ခြင်း၊ အသစ်တစ်ခု သင်ယူခြင်းတို့ကနေ ရနိုင်ပါတယ်။ ဘယ်လှုပ်ရှားမှုတွေက လန်းဆန်းစေသလဲ သတိထားပါ။ တစ်ပတ်အတွင်း နှစ်သက်တဲ့အရာတစ်ခုအတွက် အချိန်ပေးပါ။","ko":"기쁨을 위해 비싸거나 대단한 것이 필요한 것은 아닙니다. 음악, 요리, 대화, 좋아하는 이야기, 새로운 배움에서 기쁨을 얻을 수 있습니다. 어떤 활동이 상쾌함을 주는지 살펴보세요. 일주일에 즐거운 활동 하나를 넣고 그 시간을 지키세요.","zh":"快乐不一定需要昂贵或惊人的东西。音乐、烹饪、交谈、喜欢的故事或学习新事物都可能带来快乐。留意哪些活动让你恢复精神。每周安排一项喜欢的活动，并尽可能留住这段时间。"}},{"title":"Forgive and Move Forward","texts":{"en":"Forgiveness does not mean hurtful behaviour was acceptable. It can mean choosing not to let resentment control your future. Take the time you need, keep safe boundaries, and learn from what happened. Moving forward may mean rebuilding a relationship or creating distance. Choose what is healthy for you.","my":"ခွင့်လွှတ်ခြင်းဆိုတာ ထိခိုက်စေတဲ့ အပြုအမူကို လက်ခံတယ်လို့ မဆိုလိုပါဘူး။ မကျေနပ်မှုတွေက ကိုယ့်အနာဂတ်ကို မထိန်းချုပ်စေဖို့ ရွေးချယ်ခြင်း ဖြစ်နိုင်ပါတယ်။ လိုအပ်တဲ့အချိန်ယူပါ၊ လုံခြုံတဲ့ နယ်နိမိတ်ထားပြီး ဖြစ်ခဲ့တာကနေ သင်ယူပါ။ ရှေ့ဆက်ခြင်းဟာ ဆက်ဆံရေးပြန်တည်ဆောက်တာ ဒါမှမဟုတ် အကွာအဝေးထားတာ ဖြစ်နိုင်ပါတယ်။ ကိုယ့်အတွက် ကျန်းမာတဲ့ရွေးချယ်မှုကို လုပ်ပါ။","ko":"용서는 상처를 준 행동이 괜찮았다고 말하는 것이 아닙니다. 원망이 미래를 지배하지 않도록 선택하는 것일 수 있습니다. 필요한 시간을 갖고 안전한 경계를 지키며 경험에서 배우세요. 앞으로 나아간다는 것은 관계를 회복하거나 거리를 두는 것일 수 있습니다. 자신에게 건강한 선택을 하세요.","zh":"宽恕并不意味着伤人的行为可以接受。它可以意味着你选择不让怨恨控制未来。给自己需要的时间，保持安全的界限，并从经历中学习。向前走可能意味着修复关系，也可能意味着保持距离。选择对自己健康的方式。"}},{"title":"Give and Accept Help","texts":{"en":"Helping others can create connection and meaning. You can listen, share knowledge, or offer practical support. Receiving help is also part of healthy relationships; you do not have to solve every problem alone. Be clear about what you can offer and allow others to support you when needed.","my":"အခြားသူတွေကို ကူညီခြင်းက ဆက်နွယ်မှုနဲ့ အဓိပ္ပာယ်ကို ဖန်တီးပေးနိုင်ပါတယ်။ နားထောင်ပေးခြင်း၊ အသိပညာမျှဝေခြင်း၊ လက်တွေ့အကူအညီပေးခြင်းတို့ လုပ်နိုင်ပါတယ်။ အကူအညီလက်ခံခြင်းဟာလည်း ကျန်းမာတဲ့ဆက်ဆံရေးရဲ့ အစိတ်အပိုင်းပါ။ ပြဿနာအားလုံးကို တစ်ယောက်တည်း ဖြေရှင်းဖို့ မလိုပါဘူး။ ကိုယ်ပေးနိုင်တာကို ရှင်းလင်းစွာ သိပြီး လိုအပ်ရင် အခြားသူရဲ့အကူအညီကို လက်ခံပါ။","ko":"다른 사람을 돕는 일은 연결감과 의미를 만듭니다. 이야기를 들어 주거나 지식을 나누거나 실질적인 도움을 줄 수 있습니다. 도움을 받는 것도 건강한 관계의 일부입니다. 모든 문제를 혼자 해결할 필요는 없습니다. 자신이 제공할 수 있는 것을 분명히 하고 필요할 때 다른 사람의 지원을 받아들이세요.","zh":"帮助他人能带来联系感和意义。你可以倾听、分享知识或提供实际支持。接受帮助也是健康关系的一部分，你不必独自解决所有问题。清楚自己能提供什么，也允许别人在你需要时支持你。"}},{"title":"Live With Purpose","texts":{"en":"Purpose can be found in everyday actions, not only grand achievements. Caring for family, doing honest work, learning a skill, or welcoming someone can all matter. Ask what impact you want your ordinary days to have. Choose one action that reflects that purpose and practise it this week.","my":"ဘဝရည်ရွယ်ချက်ကို ကြီးမားတဲ့အောင်မြင်မှုတွေထဲမှာပဲ မဟုတ်ဘဲ နေ့စဉ်လုပ်ဆောင်မှုတွေထဲမှာလည်း ရှာတွေ့နိုင်ပါတယ်။ မိသားစုကို ဂရုစိုက်ခြင်း၊ ရိုးသားစွာ အလုပ်လုပ်ခြင်း၊ ကျွမ်းကျင်မှုတစ်ခု သင်ယူခြင်းတို့လည်း အရေးပါပါတယ်။ ကိုယ့်နေ့စဉ်ဘဝက ဘယ်လိုအကျိုးသက်ရောက်မှု ရှိစေချင်သလဲ မေးပါ။ အဲဒီရည်ရွယ်ချက်ကို ပြသတဲ့ လုပ်ဆောင်ချက်တစ်ခုကို ဒီအပတ် လုပ်ကြည့်ပါ။","ko":"삶의 목적은 거대한 성취뿐 아니라 일상의 행동에서도 찾을 수 있습니다. 가족을 돌보고, 정직하게 일하고, 기술을 배우는 일도 의미가 있습니다. 평범한 하루가 어떤 영향을 주기를 바라는지 물어보세요. 그 목적을 보여 주는 행동 하나를 이번 주에 실천하세요.","zh":"人生的意义不只存在于伟大的成就中，也能从日常行动里找到。照顾家人、诚实工作、学习技能，都有价值。问问自己，希望平凡的日子带来什么影响。选择一个体现这种意义的行动，并在本周实践。"}},{"title":"Celebrate Your Progress","texts":{"en":"A better life is built through many small steps. Notice what has changed: a skill you can now use, a boundary you can express, or a habit you have kept. Thank yourself for the effort, then choose the next gentle step. Growth is not a race, and your path does not need to look like anyone else's.","my":"ပိုကောင်းတဲ့ဘဝတစ်ခုဟာ သေးငယ်တဲ့ခြေလှမ်းများစွာနဲ့ တည်ဆောက်တာပါ။ အခုအသုံးချနိုင်တဲ့ ကျွမ်းကျင်မှု၊ ပြောပြနိုင်လာတဲ့ နယ်နိမိတ်၊ ဆက်ထိန်းထားနိုင်တဲ့ အလေ့အကျင့်တွေကို သတိထားပါ။ ကိုယ့်ကြိုးစားမှုအတွက် ကိုယ့်ကိုယ်ကို ကျေးဇူးတင်ပြီး နောက်ထပ် နူးညံ့တဲ့ခြေလှမ်းတစ်ခု ရွေးပါ။ တိုးတက်မှုဟာ ပြိုင်ပွဲမဟုတ်ပါဘူး။","ko":"더 나은 삶은 수많은 작은 걸음으로 만들어집니다. 이제 할 수 있게 된 기술, 표현할 수 있게 된 경계, 지켜 온 습관을 살펴보세요. 노력한 자신에게 고마워하고 다음의 작은 걸음을 선택하세요. 성장은 경주가 아니며 다른 사람의 길처럼 보일 필요도 없습니다.","zh":"更好的生活由许多小步骤组成。看看有哪些改变：现在掌握的技能、能够表达的界限，或已经坚持的习惯。感谢自己的努力，然后选择下一步温和的小行动。成长不是比赛，你的道路也不必和任何人一样。"}}]}];
let selected='en',mode='single',currentBook=0,currentChapter=0;
function progressStore(){try{return JSON.parse(localStorage.getItem('mybook-progress')||'{}')}catch(e){return {}}}
function chooseLang(lang,btn){selected=lang;document.querySelectorAll('.lang').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(document.getElementById('reader').style.display==='block'){document.getElementById('language').value=lang;updateReader();}}
function setMode(value,btn){mode=value;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(document.getElementById('reader').style.display==='block')updateReader();}
function renderBooks(){const q=document.getElementById('search').value.toLowerCase();document.getElementById('count').textContent='· '+books.length+' books';document.getElementById('books').innerHTML=books.map((b,i)=>({b,i})).filter(x=>(x.b.title+' '+x.b.category).toLowerCase().includes(q)).map(x=>'<article class="book"><div class="cover">'+x.b.icon+'</div><h3>'+x.b.title+'</h3><div class="small">'+x.b.category+' · '+x.b.chapters.length+' chapters · MyBook Original</div><button class="read" onclick="openBook('+x.i+')">Read Book →</button></article>').join('')||'<p>No books found.</p>';}
function openBook(i){currentBook=i;currentChapter=Number(progressStore()[i]||0);if(currentChapter>=books[i].chapters.length)currentChapter=books[i].chapters.length-1;document.getElementById('home').style.display='none';document.getElementById('reader').style.display='block';document.getElementById('bookTitle').textContent=books[i].icon+' '+books[i].title;document.getElementById('language').value=selected;renderChapterList();updateReader();window.scrollTo(0,0);}
function renderChapterList(){const b=books[currentBook];document.getElementById('chapterList').innerHTML=b.chapters.map((c,i)=>'<button class="chapter-btn '+(i===currentChapter?'current':'')+'" onclick="selectChapter('+i+')">'+(i+1)+'. '+c.title+'</button>').join('');document.getElementById('chapterMeta').textContent='Chapter '+(currentChapter+1)+' of '+b.chapters.length;}
function selectChapter(i){currentChapter=i;renderChapterList();updateReader();window.scrollTo(0,0);}
function updateReader(){const b=books[currentBook],chapter=b.chapters[currentChapter],lang=document.getElementById('language').value;let html='<p>'+chapter.texts[lang]+'</p>';if(mode==='dual'&&lang!=='my')html+='<hr><h3>🇲🇲 မြန်မာဘာသာ</h3><p>'+chapter.texts.my+'</p>';document.getElementById('content').innerHTML=html;document.getElementById('prevBtn').disabled=currentChapter===0;document.getElementById('nextBtn').textContent=currentChapter===b.chapters.length-1?'Finish book ✓':'Next chapter →';const done=progressStore()[currentBook]||0;document.getElementById('progress').style.width=(Math.min(done+1,b.chapters.length)/b.chapters.length*100)+'%';document.getElementById('progressText').textContent='Reading progress: '+Math.min(done+1,b.chapters.length)+' / '+b.chapters.length+' chapters';}
function moveChapter(delta){const next=currentChapter+delta;if(next<0)return;if(next>=books[currentBook].chapters.length){markRead();document.getElementById('saved').textContent='🎉 You reached the end of this book!';return;}currentChapter=next;renderChapterList();updateReader();window.scrollTo(0,0);}
function bookmark(){localStorage.setItem('mybook-bookmark',JSON.stringify({book:currentBook,chapter:currentChapter}));document.getElementById('saved').textContent='🔖 Bookmark saved on this iPhone.';}
function markRead(){let p=progressStore();p[currentBook]=Math.max(Number(p[currentBook]||0),currentChapter+1);localStorage.setItem('mybook-progress',JSON.stringify(p));document.getElementById('saved').textContent='✓ Progress saved on this iPhone.';updateReader();}
function closeBook(){document.getElementById('reader').style.display='none';document.getElementById('home').style.display='block';window.scrollTo(0,0);}
renderBooks();
</script></body></html>
